openapi: 3.0.3
info:
  title: Encurtador API
  description: API de um encurtador de URL com analytics
  version: 1.0.0
components:
  schemas: {}
paths:
  /health:
    get:
      summary: Verifica se a API está no ar
      tags:
        - health
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  uptime:
                    type: number
                    description: Tempo de processo em segundos
                  timestamp:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                required:
                  - status
                  - uptime
                  - timestamp
                additionalProperties: false
  /links:
    post:
      summary: Encurta uma URL
      tags:
        - links
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: URL de destino (http ou https)
              required:
                - url
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  code:
                    type: string
                  url:
                    type: string
                    format: uri
                  title:
                    nullable: true
                    type: string
                  shortUrl:
                    type: string
                    format: uri
                    description: URL curta pronta para compartilhar
                  clicks:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                    description: Total de cliques registrados
                  createdAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                required:
                  - id
                  - code
                  - url
                  - title
                  - shortUrl
                  - clicks
                  - createdAt
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  error:
                    type: string
                  message:
                    type: string
                  issues:
                    description: Presente só em erros de validação (400)
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                      required:
                        - path
                        - message
                      additionalProperties: false
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: false
    get:
      summary: Lista os links, do mais recente para o mais antigo
      tags:
        - links
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    code:
                      type: string
                    url:
                      type: string
                      format: uri
                    title:
                      nullable: true
                      type: string
                    shortUrl:
                      type: string
                      format: uri
                      description: URL curta pronta para compartilhar
                    clicks:
                      type: integer
                      minimum: 0
                      maximum: 9007199254740991
                      description: Total de cliques registrados
                    createdAt:
                      type: string
                      format: date-time
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  required:
                    - id
                    - code
                    - url
                    - title
                    - shortUrl
                    - clicks
                    - createdAt
                  additionalProperties: false
  /links/{code}:
    get:
      summary: Detalha um link pelo código
      tags:
        - links
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 16
          in: path
          name: code
          required: true
          description: Código curto do link
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  code:
                    type: string
                  url:
                    type: string
                    format: uri
                  title:
                    nullable: true
                    type: string
                  shortUrl:
                    type: string
                    format: uri
                    description: URL curta pronta para compartilhar
                  clicks:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                    description: Total de cliques registrados
                  createdAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                required:
                  - id
                  - code
                  - url
                  - title
                  - shortUrl
                  - clicks
                  - createdAt
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  error:
                    type: string
                  message:
                    type: string
                  issues:
                    description: Presente só em erros de validação (400)
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                      required:
                        - path
                        - message
                      additionalProperties: false
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: false
  /links/{code}/titulo:
    post:
      summary: Gera com IA um título curto para o link e salva no campo title
      tags:
        - ia
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 16
          in: path
          name: code
          required: true
          description: Código curto do link
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: Código curto do link
                  title:
                    type: string
                    description: Título sugerido pela IA e salvo no link
                required:
                  - code
                  - title
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  error:
                    type: string
                  message:
                    type: string
                  issues:
                    description: Presente só em erros de validação (400)
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                      required:
                        - path
                        - message
                      additionalProperties: false
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: false
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  error:
                    type: string
                  message:
                    type: string
                  issues:
                    description: Presente só em erros de validação (400)
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                      required:
                        - path
                        - message
                      additionalProperties: false
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: false
tags:
  - name: health
    description: Saúde da API
  - name: links
    description: Links encurtados
